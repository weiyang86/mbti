    "PUT replaces all channels; trim; absent/empty removes. GET own only, empty {}. DELETE idempotent 204.",
    "Candidate regex wechat ^[a-zA-Z][a-zA-Z0-9_-]{5,19}$; qq ^[1-9]\\d{4,11}$; phone ^1[3-9]\\d{9}$. Reject null/array/unknown fields 422; strict JSON primitive/null/malformed 400.",
    "Private LocalStorageAdapter, no FileAsset/public URL. DB reference/version/size/checksum only; IO faults 503, no stale cache. Only own GET/PUT and original requester granted expose values.",
    "Actual change/clear increases recipient version, revokes old pending/accepted; identical normalized replacement preserves version. Refill never revives.",
    "Create/respond/granted require both legal discoverable F4 cards, shared live isBlocked and same accepted F4 exchange. Bind internal exchange ID; F4 withdrawal, block and discoverable opt-out permanently revoke contact requests. Re-public/new exchange/unblock never revives.",
    "ContactRequest adds observer direction, buddy_id always other public card; stable createdAt/id DESC; optional buddy_id filter; only participants; invisible/blocked omitted; stale items project revoked.",
    "channels nonempty distinct 1..3, duplicates REJECT 422, normalize fixed wechat/qq/phone order. Missing requested recipient channel generic 409. accept/decline only; exact requested set accepted, no partial fields.",
    "Per directed sender/recipient one active pending/accepted DB unique constraint. Same pending set retry 200 same ID; first create 201; different pending set or accepted duplicate 409. Reverse independent, never auto accept.",
    "Only pending recipient respond; sender 409; third party 404 before input. DELETE BOTH participants pending/accepted, revoked retry 204, declined 409. Unknown/invisible/blocked 404.",
    "granted only original sender, accepted/current version/live bound exchange/visible/unblocked. Other states, recipient, C 404. Return {channels:[{channel,value}]} exact set only.",
    "All eight operations success/error no-store; GuestGuard 401, bare objects / {code,message}; no silent identity reset. Precise test4155 CORS."
