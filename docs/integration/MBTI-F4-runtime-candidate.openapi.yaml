  "x-unknowns-runtime-selections": [
    "U01: public card ID = buddy ID; private me route only; all routes require existing guest auth.",
    "U02: lazy card, discoverable=false, empty nickname/declaration/interests, four visibility=false, illustration. Empty type unless latest own result at creation. Public type is disclosed only on explicit discovery opt-in; empty type cannot opt in.",
    "U03: persisted card type never silently overwritten. PUT selects legal 16 type; type_name from TYPE_METAS. latest_result_id only when current latest own result matches card type. has_visual_set=false until delivered visual fact exists.",
    "U04: recommend orders updatedAt/id descending; same uses server card type, missing/mismatched query=422; recommend type_code is a public filter. Visibility/block filtering precedes limit.",
    "U05: strict top-level and visibility whitelist; trim/codepoint length nickname<=40/declaration<=160, interests<=10 each<=24 trim/dedupe. Wrong object-field types/null/unknown keys=422; top-level primitive null is rejected by the existing strict JSON parser with 400. Partial visibility keys merge under owner transaction lock.",
    "U06: hidden nickname/declaration => empty string; interests/shared_interests => []; manual omitted. Avatar/type tagline only public type or neutral static. No private cached derived copy. Real is_demo=false/simulated=false.",
    "U07/U08: observer direction incoming/outgoing, buddy is other card; recipient pending accept/decline, sender pending/accepted revoke. No contact grant.",
    "U09: same pending retry=200 same ID; reverse pending/active accepted=409; first create=201. declined/revoked creates new ID; respond terminal replay=409; own revoked DELETE=204. Canonical pair transaction lock + partial unique pending/accepted. Lists latest createdAt/id descending; summary most recent relation.",
    "U10: either active block hides public/detail/discovery/exchange lists and denies new/respond/revoke with 404. Block revokes pending/accepted atomically. Unblock does not revive. Active/history lastBlockedAt retained internally. Management block/unblock uses known public card ID without sensitive projection and can handle reverse-blocked/private target; self=422/unknown=404. Block=200 true, unblock=204 idempotent. Own active blocked list contains only safe ID + anonymous management label; type/name/interests not exposed.",
    "U11: F5/F6 not implemented; no contacts/grants/location/fake counts. Expired guest retention and final release policy remain needs_human_review.",
    "U12: candidate statuses 200 GET/PUT/block/respond, 201 first exchange/200 retry, 204 DELETE; 401 auth, 404 unknown/invisible/third, 409 role/state, 422 input, parser 400. Bare objects + existing {code,message}; ISO UTC timestamps; no-store. Queries other than documented keys rejected. Bodyless operations reject nonempty body.",
    "PublicCard/Buddy/Exchange embed target only if discoverable and no bidirectional block, even when observer is target owner. Exchanges list only participants. No Prisma serialization, owners/credentials/private results never public."
  ],
