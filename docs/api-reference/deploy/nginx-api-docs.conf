# Included only by mbti-dev.bestshizhongyu.com's server block.
# Publish index.html and openapi.json into a release directory, then atomically
# point /www/wwwroot/mbti-dev-szy/api-docs at that directory.
location = /api-docs {
    return 301 /api-docs/;
}

location ^~ /api-docs/ {
    root /www/wwwroot/mbti-dev-szy;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    expires -1;
}
